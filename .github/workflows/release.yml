# Build/test/package on every PR and main push with read-only permissions.
# Publishing is a separate tag-only privileged job and always creates a DRAFT
# release for human inspection before publication.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be SemVer-like vMAJOR.MINOR.PATCH or a prerelease form; got ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build deterministic release bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v0.0.0-dev.${GITHUB_SHA:0:12}"
          fi
          AMD64_ARCHIVE="container-bin-${VERSION}-windows-amd64.zip"
          ARM64_ARCHIVE="container-bin-${VERSION}-windows-arm64.zip"
          mkdir -p dist/package-amd64 dist/package-arm64

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/cb.exe .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/cb-windows-arm64.exe .

          cp dist/cb.exe dist/package-amd64/cb.exe
          cp dist/cb-windows-arm64.exe dist/package-arm64/cb.exe
          cp LICENSE README.md dist/package-amd64/
          cp LICENSE README.md dist/package-arm64/
          # ZIP stores DOS timestamps. Normalize them and strip extra metadata so
          # separate runners/checkouts produce byte-identical archives.
          touch -d '1980-01-01 00:00:00 UTC' \
            dist/cb.exe dist/cb-windows-arm64.exe \
            dist/package-amd64/cb.exe dist/package-amd64/LICENSE dist/package-amd64/README.md \
            dist/package-arm64/cb.exe dist/package-arm64/LICENSE dist/package-arm64/README.md
          (
            cd dist/package-amd64
            zip -X "../${AMD64_ARCHIVE}" cb.exe LICENSE README.md
          )
          (
            cd dist/package-arm64
            zip -X "../${ARM64_ARCHIVE}" cb.exe LICENSE README.md
          )
          (
            cd dist
            sha256sum \
              cb.exe \
              cb-windows-arm64.exe \
              "${AMD64_ARCHIVE}" \
              "${ARM64_ARCHIVE}" > SHA256SUMS
          )
          rm -rf dist/package-amd64 dist/package-arm64
          cat dist/SHA256SUMS
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "AMD64_ARCHIVE=${AMD64_ARCHIVE}" >> "$GITHUB_ENV"
          echo "ARM64_ARCHIVE=${ARM64_ARCHIVE}" >> "$GITHUB_ENV"

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Verify reproducibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repro/package-amd64" "$RUNNER_TEMP/repro/package-arm64"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$RUNNER_TEMP/repro/cb.exe" .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$RUNNER_TEMP/repro/cb-windows-arm64.exe" .
          cp "$RUNNER_TEMP/repro/cb.exe" "$RUNNER_TEMP/repro/package-amd64/cb.exe"
          cp "$RUNNER_TEMP/repro/cb-windows-arm64.exe" "$RUNNER_TEMP/repro/package-arm64/cb.exe"
          cp LICENSE README.md "$RUNNER_TEMP/repro/package-amd64/"
          cp LICENSE README.md "$RUNNER_TEMP/repro/package-arm64/"
          touch -d '1980-01-01 00:00:00 UTC' \
            "$RUNNER_TEMP/repro/cb.exe" \
            "$RUNNER_TEMP/repro/cb-windows-arm64.exe" \
            "$RUNNER_TEMP/repro/package-amd64/cb.exe" \
            "$RUNNER_TEMP/repro/package-amd64/LICENSE" \
            "$RUNNER_TEMP/repro/package-amd64/README.md" \
            "$RUNNER_TEMP/repro/package-arm64/cb.exe" \
            "$RUNNER_TEMP/repro/package-arm64/LICENSE" \
            "$RUNNER_TEMP/repro/package-arm64/README.md"
          (
            cd "$RUNNER_TEMP/repro/package-amd64"
            zip -X "../${AMD64_ARCHIVE}" cb.exe LICENSE README.md >/dev/null
          )
          (
            cd "$RUNNER_TEMP/repro/package-arm64"
            zip -X "../${ARM64_ARCHIVE}" cb.exe LICENSE README.md >/dev/null
          )
          (
            cd "$RUNNER_TEMP/repro"
            sha256sum \
              cb.exe \
              cb-windows-arm64.exe \
              "${AMD64_ARCHIVE}" \
              "${ARM64_ARCHIVE}" > SHA256SUMS
          )
          for artifact in cb.exe cb-windows-arm64.exe "${AMD64_ARCHIVE}" "${ARM64_ARCHIVE}" SHA256SUMS; do
            sha256sum "dist/${artifact}" "$RUNNER_TEMP/repro/${artifact}"
            cmp "dist/${artifact}" "$RUNNER_TEMP/repro/${artifact}"
          done
          echo 'amd64 and arm64 binaries, archives and checksum manifest are reproducible'

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-bin-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  reproducibility:
    name: Reproduce release bundle independently
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Download first-run bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-bin-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: first

      - name: Rebuild and compare byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v0.0.0-dev.${GITHUB_SHA:0:12}"
          fi
          AMD64_ARCHIVE="container-bin-${VERSION}-windows-amd64.zip"
          ARM64_ARCHIVE="container-bin-${VERSION}-windows-arm64.zip"
          mkdir -p second/package-amd64 second/package-arm64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o second/cb.exe .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o second/cb-windows-arm64.exe .
          cp second/cb.exe second/package-amd64/cb.exe
          cp second/cb-windows-arm64.exe second/package-arm64/cb.exe
          cp LICENSE README.md second/package-amd64/
          cp LICENSE README.md second/package-arm64/
          touch -d '1980-01-01 00:00:00 UTC' \
            second/cb.exe second/cb-windows-arm64.exe \
            second/package-amd64/cb.exe second/package-amd64/LICENSE second/package-amd64/README.md \
            second/package-arm64/cb.exe second/package-arm64/LICENSE second/package-arm64/README.md
          (
            cd second/package-amd64
            zip -X "../${AMD64_ARCHIVE}" cb.exe LICENSE README.md >/dev/null
          )
          (
            cd second/package-arm64
            zip -X "../${ARM64_ARCHIVE}" cb.exe LICENSE README.md >/dev/null
          )
          (
            cd second
            sha256sum \
              cb.exe \
              cb-windows-arm64.exe \
              "${AMD64_ARCHIVE}" \
              "${ARM64_ARCHIVE}" > SHA256SUMS
          )
          for artifact in cb.exe cb-windows-arm64.exe "${AMD64_ARCHIVE}" "${ARM64_ARCHIVE}" SHA256SUMS; do
            cmp "first/${artifact}" "second/${artifact}"
          done
          echo 'independent runner reproduced binaries, archives and checksum manifest byte-for-byte'

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-bin-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Re-verify downloaded checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 2
          test -f dist/cb.exe
          test -f dist/cb-windows-arm64.exe
          test -f "dist/container-bin-${GITHUB_REF_NAME}-windows-amd64.zip"
          test -f "dist/container-bin-${GITHUB_REF_NAME}-windows-arm64.zip"
          test -f dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Refuse to release an untrusted tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          DEFAULT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq .object.sha)"
          COMPARE_STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${DEFAULT_SHA}" --jq .status)"
          if [[ "${COMPARE_STATUS}" != "ahead" && "${COMPARE_STATUS}" != "identical" ]]; then
            echo "::error::Tag commit ${GITHUB_SHA} is not in trusted ${DEFAULT_BRANCH} history (compare status: ${COMPARE_STATUS})."
            exit 1
          fi

      - name: Refuse to mutate an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          BODY="$(mktemp)"
          if ! HTTP_STATUS="$(curl --silent --show-error \
            --output "$BODY" --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$API")"; then
            echo "::error::Release lookup failed at the transport layer; refusing to continue."
            exit 1
          fi
          case "$HTTP_STATUS" in
            404) ;;
            200)
              echo "::error::Release ${GITHUB_REF_NAME} already exists; refusing to create provenance or overwrite assets."
              exit 1
              ;;
            *)
              echo "::error::Release lookup returned HTTP ${HTTP_STATUS}; refusing to continue."
              cat "$BODY" >&2
              exit 1
              ;;
          esac

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Create immutable-ready draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          BODY="$(mktemp)"
          if ! HTTP_STATUS="$(curl --silent --show-error \
            --output "$BODY" --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$API")"; then
            echo "::error::Final release lookup failed at the transport layer; refusing to publish."
            exit 1
          fi
          case "$HTTP_STATUS" in
            404) ;;
            200)
              echo "::error::Release ${GITHUB_REF_NAME} appeared during this run; refusing to overwrite or clobber assets."
              exit 1
              ;;
            *)
              echo "::error::Final release lookup returned HTTP ${HTTP_STATUS}; refusing to publish."
              cat "$BODY" >&2
              exit 1
              ;;
          esac
          RELEASE_ARGS=(
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --draft
            --title "ContainerBin ${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_ARGS[@]}" \
            dist/*.exe dist/*.zip dist/SHA256SUMS
