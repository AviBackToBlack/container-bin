# Tag-triggered release build.
#
# Deliberately a small transparent workflow instead of GoReleaser: one
# stdlib-only Go binary for one platform does not justify a release
# framework dependency in the supply chain.
#
# Creates a DRAFT release — the maintainer reviews and publishes manually.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release and upload assets
      id-token: write      # provenance attestation (OIDC)
      attestations: write  # provenance attestation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Build cb.exe (windows/amd64, reproducible flags)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Building version ${VERSION}"
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o cb.exe .

      - name: Package archive and checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="container-bin-${VERSION}-windows-amd64.zip"
          zip "${ARCHIVE}" cb.exe LICENSE README.md
          sha256sum cb.exe "${ARCHIVE}" > SHA256SUMS
          cat SHA256SUMS
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            cb.exe
            ${{ env.ARCHIVE }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "ContainerBin ${GITHUB_REF_NAME}" \
            --generate-notes \
            cb.exe "${ARCHIVE}" SHA256SUMS
