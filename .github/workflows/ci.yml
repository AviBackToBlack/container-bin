name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, vet, test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race ./...
      - name: Verify release-style version injection
        run: |
          # The binary MUST be named cb: argv[0] dispatch treats any other
          # basename as a tool shim and refuses to run the management CLI.
          go build -trimpath -ldflags "-X main.version=v0.0.0-citest" -o ./cb .
          out="$(./cb version)"
          echo "$out"
          case "$out" in
            *v0.0.0-citest*) ;;
            *) echo "ldflags version injection failed" >&2; exit 1 ;;
          esac

  test-windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go test
        run: go test -v ./...
      - name: Test benchmark comparison (Windows PowerShell 5.1)
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-compare-startup-benchmarks.ps1
        shell: pwsh
      - name: Build cb.exe
        run: go build -trimpath -o cb.exe .
      - name: Smoke-test version output
        run: |
          $v = .\cb.exe version
          Write-Host $v
          if ($v -notmatch '^container-bin \S+') { exit 1 }
        shell: pwsh

  test-windows-arm64:
    name: Test and build (Windows ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          $runtimeArch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          $goArch = (go env GOARCH).Trim()
          Write-Host "runtime architecture: $runtimeArch"
          Write-Host "Go architecture: $goArch"
          if ($runtimeArch -ne 'Arm64' -or $goArch -ne 'arm64') {
            throw "expected native Windows ARM64, got runtime=$runtimeArch go=$goArch"
          }
      - name: go test
        run: go test -v ./...
      - name: Build release-style cb.exe
        run: go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=v0.0.0-arm64-citest" -o cb.exe .
      - name: Smoke-test native management and shim dispatch
        shell: pwsh
        run: |
          $versionOutput = .\cb.exe version
          Write-Host $versionOutput
          if ($versionOutput -ne 'container-bin v0.0.0-arm64-citest') {
            throw "release-style version injection failed: $versionOutput"
          }

          Copy-Item -LiteralPath .\cb.exe -Destination .\jq.exe
          $stubDir = Join-Path $env:RUNNER_TEMP 'container-bin-docker-stub'
          $stubLog = Join-Path $stubDir 'argv.txt'
          New-Item -ItemType Directory -Path $stubDir -Force | Out-Null
          @'
          @echo off
          > "%CB_DOCKER_STUB_LOG%" echo %*
          exit /b 42
          '@ | Set-Content -LiteralPath (Join-Path $stubDir 'docker.cmd') -Encoding Ascii
          $env:CB_DOCKER_STUB_LOG = $stubLog
          $env:PATH = "$stubDir;$env:PATH"

          & .\jq.exe --version
          $shimExit = $LASTEXITCODE
          $dockerArgs = Get-Content -LiteralPath $stubLog -Raw
          Write-Host "docker stub argv: $dockerArgs"
          if ($shimExit -ne 42) {
            throw "shim did not preserve docker exit 42: got $shimExit"
          }
          if ($dockerArgs -notmatch '^run --rm -i ' -or
              $dockerArgs -notmatch [regex]::Escape('ghcr.io/jqlang/jq:latest') -or
              $dockerArgs -notmatch ' --version\s*$') {
            throw "shim did not dispatch the expected jq docker command: $dockerArgs"
          }
          # The expected shim exit was 42. Clear the native-command status only
          # after asserting it so pwsh reports this validation step as passed.
          exit 0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # govulncheck tooling tracks the latest Go toolchain, which can be
          # newer than the module's minimum version in go.mod.
          go-version: stable
      - name: Install govulncheck
        # Pinned like every other supply-chain input. Freshness of results is
        # unaffected: govulncheck downloads the live vulnerability database at
        # scan time regardless of the tool version. Bump the pin manually
        # (Dependabot cannot track `go install` versions inside workflows).
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Run govulncheck
        run: govulncheck ./...
