name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, vet, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race ./...

  test-windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go test
        run: go test ./...
      - name: Build cb.exe
        run: go build -trimpath -o cb.exe .
      - name: Smoke-test version output
        run: |
          $v = .\cb.exe version
          Write-Host $v
          if ($v -notmatch '^container-bin \S+') { exit 1 }
        shell: pwsh

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # govulncheck tooling tracks the latest Go toolchain, which can be
          # newer than the module's minimum version in go.mod.
          go-version: stable
      - name: Install govulncheck
        # Deliberately unpinned, unlike the SHA-pinned actions: a vulnerability
        # scanner is only useful fresh, Dependabot cannot track `go install`
        # pins inside workflows, and this job has read-only permissions and no
        # secrets, so the blast radius of a compromised release is minimal.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
