name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/doctor-powershell-modulepath, codex/acl-coverage-c0]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, vet, test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: Verify shipping compiler and defaults
        run: |
          test "$(go env GOVERSION)" = "go$(tr -d '\r\n' < .go-version)"
          test -z "$(go list -f '{{.DefaultGODEBUG}}' .)"
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race ./...
      - name: Test packaged-binary vulnerability gate
        run: bash scripts/test-check-release-binaries.sh
      - name: Test embedded Python bootstraps and pipx discovery
        run: python3 -m unittest -v internal/pythonenv/bootstrap_test.py internal/registry/pipx_wrapper_test.py internal/cli/pipx_discovery_test.py
      - name: Python state archive round trips (disposable Docker daemon)
        env:
          CB_STATE_DOCKER_TEST: '1'
        run: |
          docker pull python@sha256:bf44cdfcb76cd3b41e879bc058fc37ec5872002ccfde7fcb765e218cde0cd79c
          docker pull docker.io/library/alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
          go test -v ./internal/statearchive -run '^TestPythonStateDockerRoundTrip$' -count=1
      - name: Verify release-style version injection
        run: |
          # The binary MUST be named cb: argv[0] dispatch treats any other
          # basename as a tool shim and refuses to run the management CLI.
          go build -trimpath -ldflags "-X main.version=v0.0.0-citest" -o ./cb .
          out="$(./cb version)"
          echo "$out"
          case "$out" in
            *v0.0.0-citest*) ;;
            *) echo "ldflags version injection failed" >&2; exit 1 ;;
          esac

  fuzz:
    name: Fuzz (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Fuzz parser and argv boundaries
        shell: bash
        run: |
          set -euo pipefail
          # One target per invocation; regular tests also run all seed corpora.
          # Two workers bound CPU/memory use on both runner platforms.
          for target in \
            registry:FuzzParseTOML \
            lockfile:FuzzParseLockFile \
            selfupdate:FuzzChecksumManifest \
            pathmap:FuzzNormalizeWindowsToolArgs \
            wslpathmap:FuzzMapToolArgs; do
            package="${target%%:*}"
            name="${target#*:}"
            go test "./internal/${package}" -run '^$' -fuzz "^${name}$" -fuzztime=30s -parallel=2
          done

  test-windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
      - name: go test
        run: go test -v ./...
      - name: Test benchmark comparison (Windows PowerShell 5.1)
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-compare-startup-benchmarks.ps1
        shell: pwsh
      - name: Build cb.exe
        run: go build -trimpath -o cb.exe .
      - name: Smoke-test version output
        run: |
          $v = .\cb.exe version
          Write-Host $v
          if ($v -notmatch '^container-bin \S+') { exit 1 }
        shell: pwsh

  test-windows-arm64:
    name: Test and build (Windows ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          $runtimeArch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          $goArch = (go env GOARCH).Trim()
          $goHostArch = (go env GOHOSTARCH).Trim()
          Write-Host "runtime architecture: $runtimeArch"
          Write-Host "Go architecture: $goArch"
          Write-Host "Go host architecture: $goHostArch"
          if ($runtimeArch -ne 'Arm64' -or $goArch -ne 'arm64' -or $goHostArch -ne 'arm64') {
            throw "expected native Windows ARM64, got runtime=$runtimeArch go=$goArch gohost=$goHostArch"
          }
      - name: go test
        run: go test -v ./...
      - name: Build release-style cb.exe
        run: go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=v0.0.0-arm64-citest" -o cb.exe .
      - name: Smoke-test native management and shim dispatch
        shell: pwsh
        run: |
          $versionOutput = .\cb.exe version
          Write-Host $versionOutput
          if ($versionOutput -ne 'container-bin v0.0.0-arm64-citest') {
            throw "release-style version injection failed: $versionOutput"
          }

          Copy-Item -LiteralPath .\cb.exe -Destination .\jq.exe
          $stubDir = Join-Path $env:RUNNER_TEMP 'container-bin-docker-stub'
          $stubLog = Join-Path $stubDir 'argv.txt'
          New-Item -ItemType Directory -Path $stubDir -Force | Out-Null
          $stubSource = Join-Path $stubDir 'main.go'
          @'
          package main

          import (
              "os"
              "strings"
          )

          func main() {
              line := strings.Join(os.Args[1:], " ") + "\n"
              if err := os.WriteFile(os.Getenv("CB_DOCKER_STUB_LOG"), []byte(line), 0o600); err != nil {
                  panic(err)
              }
              os.Exit(42)
          }
          '@ | Set-Content -LiteralPath $stubSource -Encoding Utf8
          go build -trimpath -buildvcs=false -o (Join-Path $stubDir 'docker.exe') $stubSource
          $env:CB_DOCKER_STUB_LOG = $stubLog
          $env:PATH = "$stubDir;$env:PATH"

          & .\jq.exe --version
          $shimExit = $LASTEXITCODE
          $dockerArgs = Get-Content -LiteralPath $stubLog -Raw
          Write-Host "docker stub argv: $dockerArgs"
          if ($shimExit -ne 42) {
            throw "shim did not preserve docker exit 42: got $shimExit"
          }
          if ($dockerArgs -notmatch '^run --rm -i ' -or
              $dockerArgs -notmatch [regex]::Escape('ghcr.io/jqlang/jq:latest') -or
              $dockerArgs -notmatch ' --version\s*$') {
            throw "shim did not dispatch the expected jq docker command: $dockerArgs"
          }
          # The expected shim exit was 42. Clear the native-command status only
          # after asserting it so pwsh reports this validation step as passed.
          exit 0

  source-compatibility:
    name: Source compatibility (Go 1.24; not release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Existing Go shim compatibility only; never upload these outputs.
          go-version: '1.24.13'
          check-latest: false
      - name: Check offline source compatibility
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          CGO_ENABLED: '0'
        run: |
          go test ./...
          GOOS=windows GOARCH=amd64 go build -buildvcs=false -o "$RUNNER_TEMP/cb-amd64.exe" .
          GOOS=windows GOARCH=arm64 go build -buildvcs=false -o "$RUNNER_TEMP/cb-arm64.exe" .

  govulncheck-targets:
    name: govulncheck (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Analyze the standard library that actually builds the releases.
          go-version-file: .go-version
          check-latest: false
      - name: Install govulncheck
        # Pinned like every other supply-chain input. Freshness of results is
        # unaffected: govulncheck downloads the live vulnerability database at
        # scan time regardless of the tool version. Bump the pin manually
        # (Dependabot cannot track `go install` versions inside workflows).
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Run govulncheck
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: '0'
        run: govulncheck -show version ./...

  govulncheck:
    # Preserve the existing check name for repositories requiring this gate.
    name: govulncheck
    needs: govulncheck-targets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every supported target scan
        env:
          SCAN_RESULT: ${{ needs.govulncheck-targets.result }}
        run: test "$SCAN_RESULT" = success
