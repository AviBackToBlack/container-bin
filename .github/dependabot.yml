version: 2

updates:
  # Keep GitHub Actions SHA pins current. Dependabot updates both the full SHA
  # and the human-readable version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ContainerBin intentionally has no third-party Go runtime dependencies today,
  # but keep the toolchain directive and any future modules covered.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      time: "06:10"
      timezone: Europe/Dublin
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "deps"
    groups:
      routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
