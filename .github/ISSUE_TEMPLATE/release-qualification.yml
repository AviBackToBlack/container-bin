name: Release qualification
description: Record risk-based manual qualification for the actual shipping ContainerBin candidate
title: "[release] "
labels: ["release-qualification"]
body:
  - type: markdown
    attributes:
      value: |
        Record **actual published-candidate** evidence under
        [Release Qualification Policy v2](https://github.com/AviBackToBlack/container-bin/blob/main/docs/release-qualification-policy.md)
        and the [release matrix](https://github.com/AviBackToBlack/container-bin/blob/main/docs/release-matrix.md).
        Use PASS / FAIL / BLOCKED / NOT RUN. A private harness failure is not
        automatically a product FAIL; an incomplete gate is never a PASS.
        **Sanitize all outputs** (doctor, registry, logs, PATH, tokens and proxy
        URLs may contain secrets). Do not attach raw private evidence.
  - type: input
    id: candidate
    attributes:
      label: Exact release candidate tag and source commit
      placeholder: "v2.1.0-rc.1 @ full commit SHA"
    validations:
      required: true
  - type: textarea
    id: supply-chain
    attributes:
      label: Signed artifacts, provenance, security, CI and reproducibility
      description: Published hashes, signed tag, attestation, pinned build toolchain, actual binary scans, native CI and independent reproduction. Document any difference between candidate and prospective stable source.
      render: text
    validations:
      required: true
  - type: textarea
    id: cell-powershell51-current
    attributes:
      label: PowerShell 5.1 — current Docker Desktop (Z)
      description: Exact Desktop build, doctor, published-candidate self-test 15/0/0 and seven environment facts, cleanup.
      render: text
    validations:
      required: true
  - type: textarea
    id: cell-pwsh-current
    attributes:
      label: PowerShell 7.x — current Docker Desktop (Z)
      description: Exact Desktop build, doctor, published-candidate self-test 15/0/0 and seven environment facts, cleanup.
      render: text
    validations:
      required: true
  - type: textarea
    id: cell-cmd-current
    attributes:
      label: cmd.exe — current Docker Desktop (Z)
      description: Exact Desktop build, doctor, published-candidate self-test 15/0/0 and seven environment facts, cleanup.
      render: text
    validations:
      required: true
  - type: textarea
    id: cell-powershell51-previous
    attributes:
      label: PowerShell 5.1 — previous Docker Desktop (Z-LAPTOP)
      description: Exact Desktop build, doctor, published-candidate self-test 15/0/0 and seven environment facts, cleanup.
      render: text
    validations:
      required: true
  - type: textarea
    id: cell-pwsh-previous
    attributes:
      label: PowerShell 7.x — previous Docker Desktop (Z-LAPTOP)
      description: Exact Desktop build, doctor, published-candidate self-test 15/0/0 and seven environment facts, cleanup.
      render: text
    validations:
      required: true
  - type: textarea
    id: cell-cmd-previous
    attributes:
      label: cmd.exe — previous Docker Desktop (Z-LAPTOP)
      description: Exact Desktop build, doctor, published-candidate self-test 15/0/0 and seven environment facts, cleanup.
      render: text
    validations:
      required: true
  - type: textarea
    id: state-current
    attributes:
      label: Persistent state and provider integration — current Desktop
      description: Python new/legacy state and backup/restore, pipx, Node, jq/Terraform, streams/PTY, security negatives and cleanup.
      render: text
    validations:
      required: true
  - type: textarea
    id: state-previous
    attributes:
      label: Persistent state and provider integration — previous Desktop
      description: Same complete state/provider suite, separately evidenced on the previous Desktop version.
      render: text
    validations:
      required: true
  - type: textarea
    id: wsl2
    attributes:
      label: Native WSL2 — current Desktop
      description: Published Linux artifact/provenance, two project storage modes, tool/stream/PTY/path tests, cleanup and namespace isolation. Report actual distro/kernel/Engine.
      render: text
    validations:
      required: true
  - type: textarea
    id: self-update
    attributes:
      label: Actual published-to-published self-update
      description: Actual prior published v2.0.1 binary to exact candidate; auth, transaction, shims and residue. Distinguish simulated source-version tests.
      render: text
    validations:
      required: true
  - type: textarea
    id: preservation
    attributes:
      label: Per-host before/after preservation and cleanup
      description: Docker inventories, protected installs, persistent PATH, verified test-owned cleanup and residual resources. Do not assert continuous forensic coverage.
      render: text
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: Consolidated release readiness and outstanding blockers
      description: Explicit PASS/FAIL/BLOCKED/NOT RUN for mandatory gates; GO or NO-GO with reasons. Stable merge/tag/publication are separately authorized.
      render: text
    validations:
      required: true
