name: Release qualification
description: Record the Windows and WSL2/Docker Desktop validation matrix for a release
title: "[release] "
labels: ["release-qualification"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to record the manual Windows and WSL2/Docker Desktop
        release-qualification matrix. See [docs/release-matrix.md](https://github.com/AviBackToBlack/container-bin/blob/main/docs/release-matrix.md)
        for the full procedure, the grid, and the per-cell steps.

        **Sanitize everything you paste** — `cb doctor` output, registry
        snippets and environment output can contain credentials (cloud
        tokens passed via `env_prefixes`, proxy URLs with passwords, private
        registry hosts).
  - type: input
    id: version
    attributes:
      label: cb version / git tag being qualified
      placeholder: "v1.2.3"
    validations:
      required: true
  - type: textarea
    id: self-update-published-e2e
    attributes:
      label: Published-release self-update E2E
      description: Record the previous release, exact published candidate tag, source commit, signed GitHub CLI version/publisher, command, and complete sanitized JSON result from scripts/qualify-self-update-published.ps1.
      render: text
    validations:
      required: true
  - type: textarea
    id: cell-wsl2-current
    attributes:
      label: Native WSL2 — current stable Docker Desktop
      description: Record the exact candidate tag/source commit, archive checksum and attestation, Windows/Docker Desktop/Engine/distribution/kernel versions, both storage-mode process results, path-boundary checks, state isolation/persistence, cleanup recovery, final zero-residue check, and proof that native Windows volumes were preserved.
      render: text
    validations:
      required: true
  - type: textarea
    id: cell-powershell51-current
    attributes:
      label: Windows PowerShell 5.1 — current stable Docker Desktop
      description: Docker Desktop version, `cb doctor` output (sanitized), `cb self-test --release` result, and any smoke-test commands.
      render: text
  - type: textarea
    id: cell-powershell51-previous
    attributes:
      label: Windows PowerShell 5.1 — previous stable Docker Desktop
      description: Docker Desktop version, `cb doctor` output (sanitized), `cb self-test --release` result, and any smoke-test commands.
      render: text
  - type: textarea
    id: cell-pwsh-current
    attributes:
      label: PowerShell 7.x — current stable Docker Desktop
      description: Docker Desktop version, `cb doctor` output (sanitized), `cb self-test --release` result, and any smoke-test commands.
      render: text
  - type: textarea
    id: cell-pwsh-previous
    attributes:
      label: PowerShell 7.x — previous stable Docker Desktop
      description: Docker Desktop version, `cb doctor` output (sanitized), `cb self-test --release` result, and any smoke-test commands.
      render: text
  - type: textarea
    id: cell-cmd-current
    attributes:
      label: cmd.exe — current stable Docker Desktop
      description: Docker Desktop version, `cb doctor` output (sanitized), `cb self-test --release` result, and any smoke-test commands.
      render: text
  - type: textarea
    id: cell-cmd-previous
    attributes:
      label: cmd.exe — previous stable Docker Desktop
      description: Docker Desktop version, `cb doctor` output (sanitized), `cb self-test --release` result, and any smoke-test commands.
      render: text
